<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to Studyhub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-brand">
          <div class="brand-icon">S</div>
          <span>Studyhub</span>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>
      </div>

      {{if .message}}
      <div class="alert alert-error">
        <span>{{.message}}</span>
      </div>
      {{end}}

      <form action="/user/login" method="POST" hx-post="/user/login" hx-swap="outerHTML">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@school.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">
          <span>Log In</span>
          <span class="htmx-indicator spinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/user/register">Sign up</a>
      </div>
    </div>
  </div>

</body>
</html>
