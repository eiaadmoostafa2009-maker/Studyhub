<div class="alert alert-success" style="margin: 16px 20px;">
  <span>{{if .message}}{{.message}}{{else}}Operation completed successfully{{end}}</span>
</div>

<!-- Auto refresh feed stream -->
<div 
  hx-get="/posts/" 
  hx-trigger="load delay:300ms" 
  hx-target="#feed-container" 
  hx-swap="innerHTML"
>
  <div class="empty-state">
    <div class="spinner"></div>
    <p style="margin-top: 8px;">Refreshing feed...</p>
  </div>
</div>
